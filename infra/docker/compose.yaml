# Local development stack for Coral.
#   docker compose -f infra/docker/compose.yaml up -d            # postgres + observability
#   docker compose -f infra/docker/compose.yaml --profile api up   # also run the API container
name: coral

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: coral
      POSTGRES_PASSWORD: coral
      POSTGRES_DB: coral
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coral -d coral"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686" # UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  api:
    profiles: ["api"]
    build:
      context: ../../apps/api
    environment:
      CORAL_ENV: local
      CORAL_DATABASE__HOST: postgres
      CORAL_TELEMETRY__ENABLED: "true"
      CORAL_TELEMETRY__OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
