name: api

on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  # On main, these checks run as the first stage of api-deploy.yml.
  workflow_call:

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; never a run that gates a production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: coral
          POSTGRES_PASSWORD: coral
          POSTGRES_DB: coral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coral -d coral_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CORAL_ENV: test
      CORAL_DATABASE__HOST: localhost
      CORAL_DATABASE__NAME: coral_test
      CORAL_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations apply cleanly (offline SQL render + upgrade)
        run: uv run alembic upgrade head --sql > /dev/null && uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
