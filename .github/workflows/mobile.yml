name: mobile

on:
  pull_request:
    paths: ["apps/mobile/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @coral/mobile lint
      - name: Type check
        run: pnpm --filter @coral/mobile typecheck
      - name: Test
        run: pnpm --filter @coral/mobile test --ci
      - name: Expo doctor
        run: pnpm --filter @coral/mobile doctor
      - name: Web export (smoke build)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist
